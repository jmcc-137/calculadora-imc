<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js" defer></script>
    <title>Document</title>
</head>
<body>
    
    <section>
        
        <form id="formulario">
            <div class="padre">
                <div>
                    <h1>Calculadora IMC</h1>

                </div>
                <div class="p1">
                    <div>
                        <label for="">Edad </label><input type="number" class="inputElement" name="edad" id="edad" required>
                    </div>
                   
                    <div>
                        <label for="">Nombre </label><input type="text" class="inputElement" name="nombre" id="nombre" required>

                    </div>
                    
                </div>
                <div class="p2">
                    <div>
                        <label for="">Altura(metros) </label><input type="number" step="any" class="inputElement" name="altura" id="altura"  required>
  
                    </div>
                    <div>
                        <label for="">Peso(kg) </label><input type="number" class="inputElement" name="peso" id="peso" required>

                    </div>
                
                </div>
                <div class="button">
                    <button  type="submit" value="Enviar" id="b1">Enviar</button>
                

                </div>

                
                    <div id="img" class="img">
                        

                    </div>

                

            </div>
        </form>
    </section>
</body>
</html>
